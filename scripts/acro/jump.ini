; Black Widow jump (ROTTRFramework acro module): these library entries of Lara play Black Widow's jump while the menu
; option "Black Widow jump" is on (INI [Acrobatics] BlackWidowJump=1). Each entry keeps its own sounds.
; Clips made by re/acro/bw2lara.js from BW 62406 (tucked standing jump), --root-z fold / anchor:95. The standing jump is
; the original conversion; the running jump is the same jump with the arms rising gradually through the rise until the
; fall clip (--arms-lift / --arms-hold 0:upper, user 2026-09-30).
; The descent (inair_generic_fall_*) stays Lara's own fall: BW's looked stiff coming down (user, 2026-09-30).
; <library entry name>=<clip file in this folder>; press "Reload clips" in the menu after a change.
[Jump]
ground_run_jump_forward=acro_jump_run_takeoff.tr10anim
ground_sprint_jump=acro_jump_run_takeoff.tr10anim
inair_generic_neutral=acro_jump_run_rise.tr10anim
inair_generic_back=acro_jump_run_rise.tr10anim
inair_generic_left=acro_jump_run_rise.tr10anim
inair_generic_right=acro_jump_run_rise.tr10anim
inair_sprint_neutral=acro_jump_run_rise.tr10anim
ground_generic_jump_forward=acro_jump_stand_takeoff.tr10anim
ground_idle_jump_up=acro_jump_stand_takeoff.tr10anim
inair_vertical_neutral=acro_jump_stand_rise.tr10anim
inair_vertical_back=acro_jump_stand_rise.tr10anim
inair_vertical_left=acro_jump_stand_rise.tr10anim
inair_vertical_right=acro_jump_stand_rise.tr10anim
