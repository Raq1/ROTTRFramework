; Combat evade clips (ROTTRFramework acro module): <Lara library entry>=<clip file in this folder>.
; Several entries may share one clip. Edit, then press "Reload clips" in the menu (or restart).
; Clips are made with re/acro/bw2lara.js; the entries are the ones the "ranged_evade" graph plays.
; Side evades: *_flip = aerial cartwheel: the evade front flip (BW 15589) turned to roll sideways (bw2lara --side-flip),
;              *_leap = Black Widow side leap with a twist in the air (BW 6266 left / 6265 right),
;              *_roll = low side roll over one hand, gun-kata (BW 20767 left / 20771 right).
[Evades]
Dodge_Forward=acro_frontflip.tr10anim
Dodge_Center=acro_backflip.tr10anim
Dodge_Left=acro_side_left_flip.tr10anim
Dodge_Right_pistol=acro_side_right_flip.tr10anim
Dodge_Right_smg=acro_side_right_flip.tr10anim
; the side leap or the low roll instead:
;Dodge_Left=acro_side_left_leap.tr10anim
;Dodge_Right_pistol=acro_side_right_leap.tr10anim
;Dodge_Right_smg=acro_side_right_leap.tr10anim
;Dodge_Left=acro_side_left_roll.tr10anim
;Dodge_Right_pistol=acro_side_right_roll.tr10anim
;Dodge_Right_smg=acro_side_right_roll.tr10anim
; the bow has its own entries (not changed unless listed):
;Dodge_Forward_Bow=acro_frontflip.tr10anim
;Dodge_Center_Bow=acro_backflip.tr10anim
;Dodge_Left_Bow=acro_side_left_flip.tr10anim
;Dodge_Right_Bow=acro_side_right_flip.tr10anim
