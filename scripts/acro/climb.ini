; Acrobatic climb-up (ROTTRFramework acro module): the ledge pull-up entries of Lara's library and the clips they play
; when she climbs up from a hang. Clips made with re/acro/climbwheel.js.
; <pull-up library entry name>=<clip file in this folder>; press "Reload clips" in the menu after a change.
; [Climb]: while the jump button (pad A / Space) is held (the wheel).
[Climb]
ledgeb_jump_up_to_stand_fast=acro_climb_wheel.tr10anim
ledgeb_jump_up_to_stand_fast_angleUp=acro_climb_wheel_up.tr10anim
ledgeb_jump_up_to_stand_fast_angleDown=acro_climb_wheel_down.tr10anim
; [ClimbTap]: every other climb-up (Black Widow's vault, BW 1072).
[ClimbTap]
ledgeb_jump_up_to_stand_fast=acro_climb_vault.tr10anim
ledgeb_jump_up_to_stand_fast_angleUp=acro_climb_vault_up.tr10anim
ledgeb_jump_up_to_stand_fast_angleDown=acro_climb_vault_down.tr10anim
