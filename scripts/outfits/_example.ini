; Custom campsite outfit (ROTTRFramework v0.9.311; packages and [Toggles] v0.9.331).
; Files whose name starts with "_" are ignored. To try it, copy this file to e.g. "My Outfit.ini"
; (or to a folder "My Outfit\outfit.ini") next to it and restart the game.
; NOTE: new mods use <game>\mods\<Name>\mod.json, made with ROTTROutfitManager.exe (see README.txt). This
;        folder's format still loads.
; Packages: "My Outfit.zip" in this folder = a zipped outfit folder (outfit.ini at the top of the .zip or in one
;        folder, plus the resource files and optional *.lua); the framework unpacks it to outfits\_packages\.
;
; Base   object of the campsite outfit this one is copied from: recipe, menu image, sort order and
;        character profile come from it. The .drm names (without ".drm") are listed in TrRebootModTools'
;        Documentation.md, "Appendix 1: Outfit reference", e.g. laracroft_classic05 (Classic Chronicles Catsuit).
;        Custom outfits are always available at the campsite, even when the base outfit is locked.
; Object object the outfit wears:
;        - an object the game already has (e.g. laracroft_classic01), or
;        - a NEW name (e.g. laracroft_myoutfit) for a brand-new model. Then the outfit needs its own folder,
;          "outfits\<Name>\outfit.ini" (or Files=, below), holding the exported resource files under their original IDs, as
;          TrRebootModTools/Blender write them (267210.tr10modeldata, lara_skin.178450.tr10material,
;          1485402.dds, ...; subfolders are fine). At startup the framework builds
;          bigfile._mod.rottrframework.000.000.tiger + .nfo in the game folder: a copy of the Model outfit's
;          .drm with your files swapped in under fresh IDs, so the retail outfit stays untouched.
;          The archive is rebuilt only when a file or setting changed. Object must not be an existing object.
; Files  (new models, optional) folder with the resource files when they are not next to outfit.ini: absolute,
;        or relative to the .ini's folder. E.g. outfits\Lito.ini with Files=..\..\Lito uses the game folder's
;        Lito folder.
; Model  (new models, optional) outfit whose .drm the new one is built from, i.e. the outfit your exported files
;        replace parts of. Left out, the framework picks the outfit whose .drm holds the files' IDs (above all
;        the .tr10modeldata's) and logs it; Base if none does.
; Sources (new models, optional) more outfit objects, comma separated, to take resources from that your files
;        refer to but the Model .drm lacks. The retail outfits are always searched.
; Name / Description   shown in the campsite (optional; the base outfit's text otherwise).
; Author / Version     shown for packages (optional).
; [Toggles] (optional) checkboxes in the framework menu > Outfits while this outfit is worn. Each line is
;        Name=material IDs (as exported) hidden together, ",off" = hidden by default; the choice is remembered:
;          [Toggles]
;          Glasses=178450,178451
;          Hood=180010,off
; *.lua  next to outfit.ini (folders and packages) run like the scripts in ROTTRFramework\ (their settings:
;        settings\<outfit>.<script>.ini).

[Outfit]
Base=laracroft_classic05
Object=laracroft_classic01
Name=Custom Outfit Test
Description=A custom campsite slot added by ROTTRFramework.

; New model example (in outfits\My Model\outfit.ini, with the exported files next to it):
; [Outfit]
; Base=laracroft_classic05
; Object=laracroft_mymodel
; Name=My Model
